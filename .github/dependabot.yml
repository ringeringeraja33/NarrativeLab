version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Keep automated upgrades inside the versions supported by the current
    # lint toolchain and Obsidian host. Revisit these caps with their peers.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@codemirror/state"
        versions:
          - ">6.5.0"
      - dependency-name: "@codemirror/view"
        versions:
          - ">6.38.6"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
