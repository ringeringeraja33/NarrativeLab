name: Feature request
description: Propose one focused improvement to NarrativeLab.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Narrative workflow problem
      description: Describe the work that is difficult today, without prescribing implementation first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File and compatibility impact
      description: Note whether this changes Markdown, frontmatter, Library folders, Base files, spreadsheets, canvases, or project migration.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Any examples or screenshots have been stripped of private vault content.
          required: true
