name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Obsidian review lint
        run: npm run lint:obsidian

      - name: Test and validate release metadata
        run: npm test

      - name: Build community assets
        run: npm run build

      - name: Confirm committed release assets are current
        run: git diff --exit-code -- main.js manifest.json styles.css
